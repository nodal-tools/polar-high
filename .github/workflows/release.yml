name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: configure on PyPI under
    # https://pypi.org/manage/account/publishing/  (no API token needed).
    environment:
      name: pypi
      url: https://pypi.org/p/polar-high
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If the version is already on PyPI (e.g. a tag was moved
          # and re-fired the workflow), skip rather than fail. PyPI
          # rejects overwriting an existing wheel/sdist anyway, so a
          # skip is the only sensible behaviour here.
          skip-existing: true
