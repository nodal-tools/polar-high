name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gate the PyPI publish on the same lint + test suite as the `tests`
  # workflow, run against the exact tagged commit. `build` (and therefore
  # `pypi`) only runs if both pass — so a red CI can never publish to
  # PyPI. Kept inline (rather than a reusable workflow) so the `tests`
  # workflow's status-check names stay unchanged for branch protection.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[lint]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: configure on PyPI under
    # https://pypi.org/manage/account/publishing/  (no API token needed).
    environment:
      name: pypi
      url: https://pypi.org/p/polar-high
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # If the version is already on PyPI (e.g. a tag was moved
          # and re-fired the workflow), skip rather than fail. PyPI
          # rejects overwriting an existing wheel/sdist anyway, so a
          # skip is the only sensible behaviour here.
          skip-existing: true
