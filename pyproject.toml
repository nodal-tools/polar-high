[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-high"
version = "1.1.0"
description = "Python library for building indexed linear and mixed-integer programs in polars; assembles into HiGHS, exportable as MPS."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Juha Kiviluoma", email = "juha.kiviluoma@nodal-tools.fi"},
]
maintainers = [
    {name = "Juha Kiviluoma", email = "juha.kiviluoma@nodal-tools.fi"},
]
keywords = ["optimization", "linear-programming", "lp", "mip", "highs", "polars", "edsl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "highspy",
    "polars",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff>=0.6"]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mike",
    "mkdocs-include-markdown-plugin",
]

[project.urls]
Homepage = "https://github.com/nodal-tools/polar-high"
Documentation = "https://nodal-tools.github.io/polar-high/"
Issues = "https://github.com/nodal-tools/polar-high/issues"
Changelog = "https://github.com/nodal-tools/polar-high/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fixtures"]
markers = [
    "smoke: fast end-to-end smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["_archive"]

[tool.ruff.lint]
# E, F, W = pycodestyle errors/warnings + pyflakes
# I       = isort (import ordering)
# UP      = pyupgrade (modernize syntax for the target Python)
# B       = flake8-bugbear (common pitfalls)
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length — handled by the formatter, not the linter
    "E701",  # one-line `if/def: stmt` — intentional compact style here
    "E702",  # semicolon-joined statements — intentional compact style here
    "E741",  # ambiguous variable names (l, O, I) — common in math contexts
    "B008",  # function call in default argument — common pattern with pl.DataFrame()
    "B905",  # `zip()` without `strict=` — revisit when call sites are audited
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks have throwaway locals and ad-hoc patterns
"tests/_bench_*.py" = ["F841", "B007"]

